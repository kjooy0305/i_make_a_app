name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/EpubMaker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpubMaker-apk
          path: artifacts/EpubMaker.apk
          retention-days: 30

      - name: Delete existing release assets
        run: |
          gh release view latest --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null \
            | xargs -I{} gh release delete-asset latest {} --repo ${{ github.repository }} --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EpubMaker — 최신 빌드"
          body: |
            ## EpubMaker — 최신 빌드

            커밋: `${{ github.sha }}`
            빌드 일시: ${{ github.event.head_commit.timestamp }}

            ### 다운로드
            아래 **Assets** 항목의 `EpubMaker.apk` 파일을 탭하세요.

            ### 설치 방법
            1. `EpubMaker.apk` 파일을 다운로드합니다.
            2. Android 기기에서 **출처를 알 수 없는 앱 설치**를 허용합니다.
            3. APK 파일을 열어 설치합니다.

            > ⚠️ 이 APK는 디버그 서명 빌드입니다.
          files: artifacts/EpubMaker.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
