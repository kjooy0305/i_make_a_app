<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포저 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* Layout: 위에 화면 고르는 줄, 가운데에 폰 비율(390×844) 한 대. 폰 안에서 3D 마네킹을 직접 돌려 볼 수 있다. */
:root {
  --bg: #17191e;        /* 작업실 바닥: 푸른 기가 도는 먹색 */
  --panel: #23262d;
  --panel2: #2c3039;
  --line: #3a3f4a;
  --text: #eceff4;
  --sub: #9aa3b2;
  --accent: #ffd23f;    /* 선택된 관절·강조 */
  --accent-ink: #1c1600;
  --sel: #ff7a45;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.page { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
.head p { margin: 4px 0 0; color: var(--sub); max-width: 64ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.stage { display: flex; justify-content: center; }
.slot { transform-origin: top center; }

/* ===== 폰 ===== */
.phone { width: 390px; height: 844px; background: var(--bg); border: 2px solid var(--line); border-radius: 38px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 8px 24px 0; font-family: var(--font-num); font-size: 12px; color: var(--sub); }
.gesture { height: 18px; flex: none; display: flex; justify-content: center; align-items: center; background: var(--panel); }
.gesture i { width: 110px; border-top: 3px solid var(--line); border-radius: 3px; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.btn { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 10px 14px; min-height: 42px; cursor: pointer; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 12px; border-radius: 10px; white-space: nowrap; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; }

/* 메인 메뉴 */
.menu { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; background: radial-gradient(120% 70% at 50% 8%, #2b3140 0%, var(--bg) 62%); }
.logo { text-align: center; margin-bottom: 14px; }
.logo .fig { width: 120px; height: 120px; margin: 0 auto 10px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.logo h2 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.03em; }
.logo small { color: var(--sub); }
.menu .btn { min-height: 52px; font-size: 16px; text-align: left; display: flex; justify-content: space-between; }
.menu .btn span { color: var(--sub); font-weight: 400; font-size: 12px; align-self: center; }
.menu .btn.main span { color: var(--accent-ink); }
.ver { text-align: center; color: var(--sub); font-family: var(--font-num); font-size: 11px; }

/* 작업 화면 */
.tb { display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
.tb .grow { flex: 1; }
.ib { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ib[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ib:disabled { opacity: .35; }
.vp { position: relative; flex: 1; min-height: 0; background: linear-gradient(#262b36, #1b1e26); touch-action: none; }
.vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: 10px; top: 8px; font-size: 11px; color: var(--sub); pointer-events: none; font-family: var(--font-num); }
.sel-tag { position: absolute; right: 10px; top: 8px; background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; pointer-events: none; }
.models { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.models::-webkit-scrollbar { display: none; }
.mchip { flex: none; font: inherit; font-size: 12px; border-radius: 999px; padding: 4px 11px; border: 1px solid var(--line); background: rgba(35,38,45,.9); color: var(--text); cursor: pointer; }
.mchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.ctl { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 6px; display: grid; gap: 6px; }
.ctl .ttl { display: flex; align-items: center; gap: 8px; }
.ctl .ttl b { flex: 1; font-size: 14px; }
.ctl .ttl small { color: var(--sub); }
.sl { display: grid; grid-template-columns: 46px 1fr 44px; align-items: center; gap: 8px; }
.sl label { font-size: 12px; color: var(--sub); font-weight: 700; }
.sl output { font-family: var(--font-num); font-size: 12px; text-align: right; }
.sl.dis { opacity: .4; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); margin-top: -8px; border: 0; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 0; }
.row { display: flex; gap: 6px; }
.row .btn { flex: 1; }
.nav { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--panel); border-top: 1px solid var(--line); }
.nav button { font: inherit; font-size: 11px; background: none; border: 0; color: var(--sub); padding: 8px 0 7px; display: grid; gap: 2px; justify-items: center; cursor: pointer; }
.nav button i { font-style: normal; font-size: 18px; line-height: 1; color: var(--text); }
.nav button[aria-pressed="true"] { color: var(--accent); font-weight: 700; }

/* 시트 */
.dim { position: absolute; inset: 0; background: rgba(8,9,12,.6); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); padding: 10px 16px 16px; display: grid; gap: 10px; max-height: 80%; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
.sheet.full { max-height: 92%; }
.grab { width: 44px; height: 4px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet h4 { margin: 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.sheet h4 .x { margin-left: auto; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 36px; align-items: center; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .chip { min-height: 32px; padding: 3px 12px; font-size: 12px; flex: none; }
.body { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #6a7283 transparent; padding-right: 4px; }
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-thumb { background: #6a7283; border-radius: 4px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; display: grid; gap: 6px; justify-items: center; cursor: pointer; position: relative; min-width: 0; }
.tile .pic { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; background: var(--bg); display: grid; place-items: center; overflow: hidden; }
.tile b { font-size: 12px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .lock { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: #000a; color: var(--accent); border: 1px solid var(--accent); }
.tile.locked .pic { opacity: .45; }
.sub { color: var(--sub); font-size: 12px; }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg) inset; }
.list { display: grid; gap: 6px; }
.li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); font: inherit; color: var(--text); text-align: left; cursor: pointer; }
.li small { color: var(--sub); display: block; }
.fing { display: grid; gap: 4px; }
.fing .row .btn { padding: 4px 0; min-height: 32px; font-size: 12px; }
.cap { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; background: #fff2; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); font-weight: 700; padding: 8px 16px; border-radius: 999px; z-index: 9; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

  <header class="head">
    <h1>포저 시안</h1>
    <p>3D 마네킹으로 포즈를 잡는 앱의 시안이에요. 폰 안에서 직접 해 보세요: 관절(노란 점)을 눌러 고르고 아래 슬라이더로 돌리고, 배경을 끌면 카메라가 돌아요. 모델 10종, 완성된 포즈 25개, 손가락 편집과 핸드포즈, 소품·헤어·의상, 카메라·조명, 저장·불러오기가 움직여요. 동물·탈것 팩과 상점은 화면만 있어요.</p>
  </header>
  <div class="bar" id="bar">

    <button class="chip" data-v="add" aria-pressed="false">모델 추가</button>
    <button class="chip" data-v="pose" aria-pressed="false">완성된 포즈</button>
    <button class="chip" data-v="hand" aria-pressed="false">손·꾸미기</button>
    <button class="chip" data-v="cam" aria-pressed="false">카메라</button>
    <button class="chip" data-v="light" aria-pressed="false">조명</button>
    <button class="chip" data-v="save" aria-pressed="false">저장·불러오기</button>
    <button class="chip" data-v="set" aria-pressed="false">설정</button>
  </div>
  <div class="stage"><div class="slot" id="slot"><div class="phone" id="phone"></div></div></div>
</div>
