<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음악 이름 관리 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: 위에 화면 고르는 줄, 가운데에 폰 비율(390×844) 한 대, 또는 전체 보기에서 폰 3대를 나란히. 디자인만 보는 시안이라 버튼은 눌러도 아무 일도 일어나지 않는다. */
:root {
  --bg: #15131a;        /* 바탕: 보라 기운 있는 먹색 */
  --panel: #1f1c27;     /* 카드와 시트 */
  --line: #353042;      /* 얇은 선 */
  --text: #f3eff8;
  --sub: #a59fb5;
  --accent: #ff6a3d;    /* 레코드판 라벨 주황 */
  --accent-ink: #1a0d08;
  --warn: #ffd166;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.page { max-width: 1260px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
.head p { margin: 4px 0 0; color: var(--sub); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip:focus-visible, .btn:focus-visible, .opt:focus-visible, .nav button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.stage { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
figcaption { font-weight: 700; color: var(--sub); }
.slot { transform-origin: top center; }

/* ===== 폰 ===== */
.phone { width: 390px; height: 844px; background: var(--bg); border: 2px solid var(--line); border-radius: 38px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 8px 24px 0; font-family: var(--font-num); font-size: 12px; color: var(--sub); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.top { padding: 10px 18px 6px; display: flex; align-items: center; gap: 10px; flex: none; }
.top h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.02em; flex: 1; }
.top .count { font-family: var(--font-num); color: var(--sub); font-size: 12px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 16px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--sub); margin: 4px 18px 8px; flex: none; }
.sorts { display: flex; gap: 6px; padding: 0 18px 8px; flex: none; }
.sorts .chip { min-height: 30px; padding: 3px 12px; font-size: 12px; }

.track { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cover { width: 46px; height: 46px; border-radius: 8px; background: conic-gradient(from 20deg, #ff6a3d, #7a3dff, #3dc9ff, #ff6a3d); position: relative; }
.cover::after { content: ""; position: absolute; inset: 17px; border-radius: 50%; background: var(--bg); }
.track b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track small { color: var(--sub); }
.track .meta { text-align: right; font-family: var(--font-num); font-size: 11px; color: var(--sub); }
.track.on b { color: var(--accent); }
.dots { color: var(--sub); font-size: 18px; letter-spacing: 1px; padding-left: 6px; }

.tools { display: flex; gap: 6px; padding: 0 18px 8px; flex: none; }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 12px; border-radius: 10px; white-space: nowrap; }
.pre { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-family: var(--font-num); font-size: 11.5px; line-height: 1.7; max-height: 190px; overflow: hidden; color: var(--text); white-space: pre; overflow-x: auto; }
.mini { flex: none; margin: 0 12px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; }
.mini .cover { width: 40px; height: 40px; }
.mini .cover::after { inset: 14px; background: var(--panel); }
.mini .bar2 { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; }
.mini .bar2 i { display: block; width: 38%; height: 100%; background: var(--accent); border-radius: 2px; }
.ctl { font-size: 18px; letter-spacing: 6px; }

.nav { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--panel); }
.nav button { font: inherit; background: none; border: 0; color: var(--sub); padding: 12px 0 10px; display: grid; gap: 2px; justify-items: center; cursor: pointer; }
.nav button[aria-current="true"] { color: var(--accent); font-weight: 700; }
.nav span { font-size: 20px; line-height: 1; }
.gesture { height: 18px; flex: none; display: flex; justify-content: center; align-items: center; background: var(--panel); }
.gesture i { width: 110px; border-top: 3px solid var(--line); border-radius: 3px; }
.fab { position: absolute; right: 18px; bottom: 84px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; font: inherit; font-weight: 900; padding: 12px 18px; box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: pointer; }

.btn { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 12px 16px; min-height: 46px; cursor: pointer; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.drop { border: 2px dashed var(--line); border-radius: 18px; padding: 26px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; margin-bottom: 14px; color: var(--sub); }
.drop .big { font-size: 34px; line-height: 1; }
h3 { margin: 14px 0 6px; font-size: 13px; color: var(--sub); font-weight: 700; letter-spacing: .04em; }
.file { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel); }
.file b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--sub); font-family: var(--font-num); font-size: 11px; }
.tag { align-self: center; grid-row: span 2; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); }
.tag.dup { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--accent); color: var(--accent); }
.foot { flex: none; padding: 10px 18px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); }

/* 중복 선택 시트 */
.dim { position: absolute; inset: 0; background: rgba(8,6,12,.62); display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--panel); border-radius: 22px 22px 0 0; padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; max-height: 92%; overflow-y: auto; }
.grab { width: 44px; height: 4px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet h4 { margin: 0; font-size: 18px; font-weight: 900; }
.sheet p { margin: 0; color: var(--sub); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp div { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--bg); min-width: 0; }
.cmp em { font-style: normal; font-size: 11px; color: var(--sub); display: block; }
.cmp b { display: block; font-size: 13px; overflow-wrap: anywhere; }
.cmp small { font-family: var(--font-num); font-size: 11px; color: var(--sub); }
.cmp .new { border-color: var(--warn); }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; cursor: pointer; }
.opt .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); font-size: 16px; }
.opt b { display: block; }
.opt small { color: var(--sub); }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .ic { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.danger .ic { color: #ff7b7b; }
.chk { display: flex; align-items: center; gap: 8px; color: var(--sub); }
.chk i { width: 18px; height: 18px; border: 1px solid var(--sub); border-radius: 5px; display: inline-block; }
.muted2 { font-size: 12px; font-weight: 700; color: var(--sub); }
.row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <h1>음악 이름 관리 시안</h1>
    <p>디자인만 확인하는 화면이에요. 버튼은 눌러도 동작하지 않아요. 아래에서 화면을 골라 보세요.</p>
  </header>
  <div class="bar" id="bar">
    <button class="chip" data-v="home" aria-pressed="true">목록(홈)</button>
    <button class="chip" data-v="up" aria-pressed="false">음악 업로드</button>
    <button class="chip" data-v="dup" aria-pressed="false">같은 이름 선택</button>
    <button class="chip" data-v="txt" aria-pressed="false">텍스트 추출</button>
    <button class="chip" data-v="all" aria-pressed="false">전체 보기</button>
  </div>
  <div class="stage" id="stage"></div>
</div>

        <div class="track"><div class="cover"></div><div><b>그날처럼</b><small>장나라</small></div><div class="meta">10.0MB</div></div>

    </div>

<template id="t-dup">
  <div class="phone"><div class="status"><span>9:41</span><span>●●● 100%</span></div>
    <div class="screen">
      <div class="top"><h2>음악 업로드</h2></div>
      <div class="scroll">

<template id="t-txt">

<script>
(function () {
  var stage = document.getElementById('stage');
  var names = { home: '목록(홈)', txt: '텍스트 추출', up: '음악 업로드', dup: '같은 이름 선택' };
  function make(v) {
    var fig = document.createElement('figure');
    var slot = document.createElement('div'); slot.className = 'slot';
    slot.appendChild(document.getElementById('t-' + v).content.cloneNode(true));
    var cap = document.createElement('figcaption'); cap.textContent = names[v];
    fig.appendChild(slot); fig.appendChild(cap); return fig;
  }
  function fit() {
    var n = stage.querySelectorAll('.slot').length;
    var avail = document.documentElement.clientWidth - 32;
    var s = Math.min(1, avail / 390);
    stage.querySelectorAll('.slot').forEach(function (el) {
      el.style.transform = 'scale(' + s + ')';
      el.style.width = '390px'; el.style.height = '844px';
      el.parentNode.style.width = Math.round(390 * s) + 'px';
      el.style.marginBottom = Math.round(-844 * (1 - s)) + 'px';
    });
  }
  function show(v) {
    stage.innerHTML = '';
    (v === 'all' ? ['home', 'up', 'dup', 'txt'] : [v]).forEach(function (k) { stage.appendChild(make(k)); });
    document.querySelectorAll('#bar .chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    fit();
    try { location.hash = v; } catch (e) {}
  }
  document.getElementById('bar').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (b) show(b.dataset.v); });
  window.addEventListener('resize', fit);
  var h = (location.hash || '').slice(1);
  show(['home', 'up', 'dup', 'txt', 'all'].indexOf(h) >= 0 ? h : 'home');
})();
</script>
</body>
