<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음악 이름 관리</title>
<style>
:root {
  --bg: #15131a;        /* 바탕: 보라 기운 있는 먹색 */
  --panel: #1f1c27;
  --line: #353042;
  --thumb: #6d6580;     /* 스크롤바 */
  --text: #f3eff8;
  --sub: #a59fb5;
  --accent: #ff6a3d;    /* 레코드판 라벨 주황 */
  --accent-ink: #1a0d08;
  --warn: #ffd166;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.chip { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font: inherit; padding: 11px 12px; outline: none; }
.in:focus { border-color: var(--accent); }
.toast { bottom: 90px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
.top { padding: 10px 18px 6px; display: flex; align-items: center; gap: 10px; flex: none; }
.top h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.02em; flex: 1; }
.top .count { font-family: var(--font-num); color: var(--sub); font-size: 12px; }
.sw { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 24px 18px; scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
.scroll::-webkit-scrollbar, .sheet::-webkit-scrollbar, .pre::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll::-webkit-scrollbar-thumb, .sheet::-webkit-scrollbar-thumb, .pre::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 4px; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--bg)); opacity: 0; transition: opacity .15s; display: flex; align-items: flex-end; justify-content: center; color: var(--sub); font-size: 11px; padding-bottom: 3px; }
.sw.more .fade { opacity: 1; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin: 4px 18px 8px; flex: none; }
.search b { color: var(--accent); font-size: 13px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; padding: 10px 0; outline: none; }
.search input::placeholder { color: var(--sub); }
.search:focus-within { border-color: var(--accent); }
.sorts, .tools { display: flex; gap: 6px; padding: 0 18px 8px; flex: none; }
.sorts .chip { min-height: 30px; padding: 3px 12px; font-size: 12px; }

.track { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.track.sub { margin-left: 22px; padding-left: 12px; border-left: 2px solid var(--accent); grid-template-columns: 38px minmax(0,1fr) auto; }
.track.sub .cover { width: 38px; height: 38px; }
.track.sub .cover::after { inset: 13px; }
.cover { width: 46px; height: 46px; border-radius: 8px; background: conic-gradient(from 20deg, #ff6a3d, #7a3dff, #3dc9ff, #ff6a3d); position: relative; flex: none; }
.cover::after { content: ""; position: absolute; inset: 17px; border-radius: 50%; background: var(--bg); }
.track b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track small { color: var(--sub); }
.track .meta { text-align: right; font-family: var(--font-num); font-size: 11px; color: var(--sub); }
.track.new b::after { content: " 새"; color: var(--accent); font-size: 11px; }
.bundle { width: 100%; font: inherit; color: var(--text); text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0 2px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; cursor: pointer; }
.bundle[aria-expanded="true"] { border-color: var(--accent); }
.stack { position: relative; width: 52px; height: 46px; }
.stack .cover { position: absolute; top: 0; width: 38px; height: 38px; }
.stack .cover::after { inset: 13px; background: var(--panel); }
.stack .cover:nth-child(1) { left: 0; top: 8px; opacity: .55; }
.stack .cover:nth-child(2) { left: 7px; top: 4px; opacity: .8; }
.stack .cover:nth-child(3) { left: 14px; top: 0; }
.bundle b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bundle small { color: var(--sub); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-left: 6px; }
.chev { width: 9px; height: 9px; border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub); transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
.bundle[aria-expanded="true"] .chev { transform: rotate(-135deg); border-color: var(--accent); }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }

.nav { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--panel); }
.nav button { font: inherit; background: none; border: 0; color: var(--sub); padding: 12px 0 10px; display: grid; gap: 2px; justify-items: center; cursor: pointer; }
.nav button[aria-current="true"] { color: var(--accent); font-weight: 700; }
.nav span { font-size: 20px; line-height: 1; }

.btn { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 12px 16px; min-height: 46px; cursor: pointer; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 12px; border-radius: 10px; white-space: nowrap; }
.btn:disabled { opacity: .4; cursor: default; }
.drop { border: 2px dashed var(--line); border-radius: 18px; padding: 24px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; margin-bottom: 14px; color: var(--sub); }
.drop .big { font-size: 34px; line-height: 1; }
h3 { margin: 14px 0 6px; font-size: 13px; color: var(--sub); font-weight: 700; letter-spacing: .04em; }
.file { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel); }
.file b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--sub); font-family: var(--font-num); font-size: 11px; }
.tag { align-self: center; grid-row: span 2; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); }
.tag.dup { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--accent); color: var(--accent); }
.foot { flex: none; padding: 10px 18px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

.dim { position: absolute; inset: 0; background: rgba(8,6,12,.62); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; background: var(--panel); border-radius: 22px 22px 0 0; padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; max-height: 88%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
.grab { width: 44px; height: 4px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet h4 { margin: 0; font-size: 18px; font-weight: 900; }
.sheet p { margin: 0; color: var(--sub); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp div { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--bg); min-width: 0; }
.cmp em { font-style: normal; font-size: 11px; color: var(--sub); display: block; }
.cmp b { display: block; font-size: 13px; overflow-wrap: anywhere; }
.cmp small { font-family: var(--font-num); font-size: 11px; color: var(--sub); }
.cmp .nw { border-color: var(--warn); }
.q { font-weight: 700; margin: 2px 0 0; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; cursor: pointer; width: 100%; }
.opt .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); font-size: 16px; }
.opt b { display: block; }
.opt small { color: var(--sub); }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt[aria-checked="true"] .ic { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.danger .ic { color: #ff7b7b; }
.opt.danger[aria-checked="true"] .ic { color: var(--accent-ink); }
.chk { display: flex; align-items: center; gap: 8px; color: var(--sub); background: none; border: 0; font: inherit; padding: 4px 0; cursor: pointer; text-align: left; }
.chk i { width: 18px; height: 18px; border: 1px solid var(--sub); border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 12px; color: var(--accent-ink); flex: none; }
.chk[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
.muted2 { font-size: 12px; font-weight: 700; color: var(--sub); }
.pre { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-family: var(--font-num); font-size: 11.5px; line-height: 1.7; height: 150px; overflow: auto; white-space: pre; scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
.toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--text); color: var(--bg); font-weight: 700; padding: 9px 16px; border-radius: 999px; z-index: 9; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.5); }

</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
