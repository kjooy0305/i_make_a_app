<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음성 받아쓰기</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e1e4ee;--txt:#161a26;--sub:#6b7388;--pri:#2b5cff;--rec:#e5484d;--font:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#1a1d25;--line:#2b303c;--txt:#e8eaf0;--sub:#8b93a7;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1115;--card:#1a1d25;--line:#2b303c;--txt:#e8eaf0;--sub:#8b93a7;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.55 var(--font)}
body{display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
h1{margin:0;font-size:18px;flex:1;min-width:120px}
select,input[type=text]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-width:0}
button{white-space:nowrap;flex:none;font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.ctl{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.rec{min-width:112px;height:48px;border-radius:24px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:16px}
.rec.on{background:var(--rec)}
.rec .d{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:8px}
.rec.on .d{animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.stat{flex:1;min-width:0}.stat b{display:block;font-variant-numeric:tabular-nums}.stat small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spk{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.spk::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);cursor:pointer;white-space:nowrap}
.chip .c{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:var(--c);font-weight:700}
.chip kbd{font:11px ui-monospace,monospace;color:var(--sub)}
.hint{color:var(--sub);font-size:12px;margin:0 0 6px}
.list{flex:1;min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px;scrollbar-width:thin}
.seg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.seg:last-child{border:0}
.seg .t{font:12px ui-monospace,monospace;color:var(--sub);width:44px;flex:none;padding-top:3px}
.seg .w{flex:1;min-width:0}
.tag{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;color:#fff;background:var(--c);cursor:pointer;margin-bottom:2px;border:0}
.txt{display:block;outline:0;word-break:break-word;white-space:pre-wrap}
.txt:focus{background:rgba(43,92,255,.08);border-radius:6px}
.seg.interim .txt{color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:40px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0 max(12px,env(safe-area-inset-bottom))}
.bar input[type=text]{flex:1;min-width:140px}
.bar .pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
label.ck{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:13px}
.msg{background:rgba(229,72,77,.12);border:1px solid var(--rec);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--txt);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:13px;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🎙 음성 받아쓰기</h1>
  <select id="lang" aria-label="인식 언어"><option value="ko-KR">한국어</option><option value="en-US">English</option></select>
  <button id="clear" title="내용 모두 지우기">지우기</button>
</header>
<div id="msg" class="msg" hidden></div>
<div class="ctl">
  <button id="rec" class="rec"><span class="d"></span><span id="recT">시작</span></button>
  <div class="stat"><b id="clock">00:00</b><small id="state">대기 중 · 시작을 누르면 들리는 말을 받아 적어요</small></div>
</div>
<div class="spk" id="spk" role="group" aria-label="지금 말하는 사람"></div>
<p class="hint">말하는 사람이 바뀌면 위의 이름을 누르세요(숫자 키 1~9도 돼요). 이후 받아 적는 말은 그 사람으로 기록돼요. 이미 적힌 말은 이름표를 눌러 바꿀 수 있어요.</p>
<div class="list" id="list" aria-live="polite"></div>
<div class="bar">
  <input type="text" id="fname" placeholder="파일 이름" aria-label="파일 이름" autocomplete="off">
  <label class="ck"><input type="checkbox" id="withTime" checked> 시간 넣기</label>
  <button id="copy">복사</button>
  <button id="dl" class="pri">⬇ 텍스트 저장</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var COLORS = ['#2b5cff', '#e5484d', '#17a673', '#d9822b', '#8b5cf6', '#0ea5b7', '#c2410c', '#64748b', '#be185d'];
  var KEY = 'voicenote.v1';
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var S = { speakers: [{ id: 1, name: '화자 1' }, { id: 2, name: '화자 2' }], cur: 1, segs: [], nextId: 3, elapsed: 0, fname: '', lang: 'ko-KR', withTime: true };
  var rec = null, running = false, startedAt = 0, base = 0, timer = null, interim = '', interimSpk = 1, stopping = false;

  function load() { try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.speakers && j.segs) { for (var k in j) S[k] = j[k]; } } catch (e) { /* 저장 못 해도 동작 */ } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ } }
  function z(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(sec) { sec = Math.floor(sec); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return (h ? z(h) + ':' : '') + z(m) + ':' + z(sec % 60); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function spk(id) { return S.speakers.filter(function (s) { return s.id === id; })[0] || S.speakers[0]; }
  function color(id) { return COLORS[(Math.max(0, S.speakers.indexOf(spk(id)))) % COLORS.length]; }
  function toast(m) { var t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 1800); }
  function showMsg(m) { var e = $('#msg'); e.textContent = m || ''; e.hidden = !m; }
  function defName() { var d = new Date(); return '녹음_' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()); }

  /* ---------- 화면 ---------- */
  function renderSpk() {
    $('#spk').innerHTML = S.speakers.map(function (s, i) {
      return '<span class="chip' + (s.id === S.cur ? ' on' : '') + '" style="--c:' + color(s.id) + '" data-id="' + s.id + '" role="button" tabindex="0"><i class="c" style="background:' + color(s.id) + '"></i>' + esc(s.name) + (i < 9 ? ' <kbd>' + (i + 1) + '</kbd>' : '') + '</span>';
    }).join('') + '<button id="addSpk" title="화자 추가">＋ 화자</button><button id="renSpk" title="선택한 화자 이름 바꾸기">✎ 이름</button>' + (S.speakers.length > 1 ? '<button id="delSpk" title="선택한 화자 삭제">－</button>' : '');
  }
  function segHtml(g) {
    var s = spk(g.spk);
    return '<div class="seg" data-i="' + g.i + '"><span class="t">' + fmt(g.t) + '</span><div class="w"><button class="tag" style="--c:' + color(s.id) + '" data-re="' + g.i + '" title="화자 바꾸기">' + esc(s.name) + '</button><span class="txt" contenteditable="true" data-ed="' + g.i + '">' + esc(g.x) + '</span></div></div>';
  }
  function renderList(stick) {
    var l = $('#list'), near = l.scrollHeight - l.scrollTop - l.clientHeight < 80;
    var h = S.segs.map(function (g, i) { g.i = i; return segHtml(g); }).join('');
    if (interim) { var s = spk(interimSpk); h += '<div class="seg interim"><span class="t">' + fmt(elapsed()) + '</span><div class="w"><span class="tag" style="--c:' + color(s.id) + '">' + esc(s.name) + '</span><span class="txt">' + esc(interim) + '</span></div></div>'; }
    if (!h) h = '<div class="empty">아직 받아 적은 내용이 없어요.<br>‘시작’을 누르고 말해 보세요.</div>';
    var ed = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.ed;
    if (ed !== undefined && ed !== null && !stick) return;   // 글을 고치는 중에는 다시 그리지 않는다
    l.innerHTML = h;
    if (stick || near) l.scrollTop = l.scrollHeight;
  }
  function elapsed() { return base + (running ? (Date.now() - startedAt) / 1000 : 0); }
  function tick() { $('#clock').textContent = fmt(elapsed()); }
  function setState(t) { $('#state').textContent = t; }
  function renderCtl() {
    $('#rec').classList.toggle('on', running); $('#recT').textContent = running ? '정지' : (S.segs.length ? '이어서 시작' : '시작');
    $('#lang').disabled = running;
  }

  /* ---------- 음성 인식 ---------- */
  function build() {
    var r = new SR();
    r.lang = S.lang; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = function () { setState('듣는 중 · ' + (S.lang === 'ko-KR' ? '한국어' : 'English') + ' · 말하는 사람: ' + spk(S.cur).name); };
    r.onresult = function (e) {
      var live = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i], txt = res[0].transcript.trim();
        if (res.isFinal) {
          if (txt) { S.segs.push({ t: Math.max(0, elapsed() - 1), spk: interim ? interimSpk : S.cur, x: txt }); save(); }
          interim = '';
        } else { live += (live ? ' ' : '') + txt; }
      }
      if (live) { if (!interim) interimSpk = S.cur; interim = live; }
      renderList(true);
    };
    r.onerror = function (e) {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { showMsg('마이크 사용이 막혀 있어요. 주소창의 자물쇠에서 마이크를 허용해 주세요.'); finish(); }
      else if (e.error === 'audio-capture') { showMsg('마이크를 찾을 수 없어요.'); finish(); }
      else if (e.error === 'network') { showMsg('음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
      else showMsg('오류: ' + e.error);
    };
    r.onend = function () {
      if (running && !stopping) { try { r.start(); } catch (err) { setTimeout(function () { if (running) { try { r.start(); } catch (e2) { finish(); } } }, 300); } }   // 침묵 뒤 자동으로 이어서 듣기
      else finishUi();
    };
    return r;
  }
  function begin() {
    if (!SR) { showMsg('이 브라우저는 음성 인식을 지원하지 않아요. 안드로이드/PC의 Chrome 또는 Edge, iOS의 Safari로 열어 주세요.'); return; }
    showMsg('');
    S.lang = $('#lang').value; base = S.elapsed || 0; startedAt = Date.now(); running = true; stopping = false; interim = '';
    if (!$('#fname').value.trim()) $('#fname').value = S.fname || defName();
    rec = build();
    try { rec.start(); } catch (e) { showMsg('시작하지 못했어요: ' + e.message); running = false; return; }
    clearInterval(timer); timer = setInterval(tick, 250);
    renderCtl(); save();
  }
  function finishUi() {
    if (!running && !interim) { renderCtl(); return; }
    running = false; clearInterval(timer);
    if (interim) { S.segs.push({ t: Math.max(0, elapsed() - 1), spk: interimSpk, x: interim }); interim = ''; }   // 아직 확정 안 된 마지막 말도 남긴다
    S.elapsed = base + (Date.now() - startedAt) / 1000; if (isNaN(S.elapsed)) S.elapsed = base;
    tick(); renderCtl(); renderList(true); save();
    setState('정지됨 · ' + S.segs.length + '줄 · 저장할 수 있어요');
  }
  function finish() { stopping = true; try { rec && rec.abort(); } catch (e) { /* 무시 */ } finishUi(); }
  function stop() { stopping = true; setState('마무리하는 중…'); try { rec.stop(); } catch (e) { /* 무시 */ } setTimeout(function () { if (running) finishUi(); }, 1500); }

  /* ---------- 내보내기 ---------- */
  function textOut() {
    var withT = $('#withTime').checked, lines = [];
    S.segs.forEach(function (g) { lines.push((withT ? '[' + fmt(g.t) + '] ' : '') + spk(g.spk).name + ': ' + g.x); });
    return lines.join('\n') + (lines.length ? '\n' : '');
  }
  function download() {
    if (!S.segs.length) { toast('저장할 내용이 없어요'); return; }
    var name = ($('#fname').value.trim() || defName()).replace(/[\\/:*?"<>|]+/g, '_').replace(/\.txt$/i, '');
    var blob = new Blob(['﻿' + textOut()], { type: 'text/plain;charset=utf-8' });   // BOM: 윈도우 메모장에서도 한글이 안 깨짐
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast(name + '.txt 저장');
  }

  /* ---------- 이벤트 ---------- */
  $('#rec').onclick = function () { running ? stop() : begin(); };
  $('#spk').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'), t = e.target.closest('button');
    if (c) { S.cur = +c.dataset.id; save(); renderSpk(); if (running) setState('듣는 중 · 말하는 사람: ' + spk(S.cur).name); return; }
    if (!t) return;
    if (t.id === 'addSpk') { var id = S.nextId++; S.speakers.push({ id: id, name: '화자 ' + (S.speakers.length + 1) }); S.cur = id; save(); renderSpk(); }
    else if (t.id === 'renSpk') {
      var n = prompt('이름 (예: 김과장, 면접관)', spk(S.cur).name);
      if (n && n.trim()) { spk(S.cur).name = n.trim(); save(); renderSpk(); renderList(); }
    } else if (t.id === 'delSpk') {
      if (!confirm('“' + spk(S.cur).name + '”을(를) 지울까요? 이 사람이 한 말은 첫 번째 화자로 옮겨져요.')) return;
      var gone = S.cur; S.speakers = S.speakers.filter(function (s) { return s.id !== gone; });
      S.segs.forEach(function (g) { if (g.spk === gone) g.spk = S.speakers[0].id; });
      S.cur = S.speakers[0].id; save(); renderSpk(); renderList();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= S.speakers.length) { S.cur = S.speakers[n - 1].id; save(); renderSpk(); }
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('#rec').click(); }
  });
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-re]'); if (!b) return;
    var g = S.segs[+b.dataset.re], i = S.speakers.indexOf(spk(g.spk));
    g.spk = S.speakers[(i + 1) % S.speakers.length].id; save(); renderList(true);   // 눌러서 다음 화자로
  });
  $('#list').addEventListener('input', function (e) { var i = e.target.dataset.ed; if (i !== undefined) { S.segs[+i].x = e.target.textContent; save(); } });
  $('#list').addEventListener('focusout', function (e) { if (e.target.dataset && e.target.dataset.ed !== undefined) { var g = S.segs[+e.target.dataset.ed]; if (g && !g.x.trim()) { S.segs.splice(+e.target.dataset.ed, 1); save(); } renderList(); } });
  $('#fname').addEventListener('input', function () { S.fname = $('#fname').value; save(); });
  $('#withTime').addEventListener('change', function () { S.withTime = $('#withTime').checked; save(); });
  $('#lang').addEventListener('change', function () { S.lang = $('#lang').value; save(); });
  $('#dl').onclick = download;
  $('#copy').onclick = function () {
    var t = textOut(); if (!t) { toast('복사할 내용이 없어요'); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('복사했어요'); }, function () { toast('복사하지 못했어요'); });
  };
  $('#clear').onclick = function () {
    if (running) { toast('먼저 정지해 주세요'); return; }
    if (!S.segs.length || !confirm('받아 적은 내용을 모두 지울까요? (저장하지 않았다면 되돌릴 수 없어요)')) return;
    S.segs = []; S.elapsed = 0; base = 0; S.fname = ''; $('#fname').value = ''; interim = ''; save(); tick(); renderCtl(); renderList(true); setState('대기 중 · 시작을 누르면 들리는 말을 받아 적어요');
  };
  window.addEventListener('beforeunload', function (e) { if (running) { e.preventDefault(); e.returnValue = ''; } });

  load();
  $('#lang').value = S.lang; $('#fname').value = S.fname || ''; $('#withTime').checked = S.withTime !== false;
  running = false; base = S.elapsed || 0; tick(); renderSpk(); renderCtl(); renderList(true);
  if (S.segs.length) setState('이전 내용이 남아 있어요 · ' + S.segs.length + '줄');
  if (!SR) showMsg('이 브라우저는 음성 인식을 지원하지 않아요. 안드로이드/PC의 Chrome 또는 Edge, iOS의 Safari로 열어 주세요.');
})();
</script>
</body>
</html>
