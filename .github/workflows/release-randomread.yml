name: "[RandomRead] Build & Release APK"

on:
  push:
    tags:
      - 'randomread-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x randomread/gradlew

      - name: Build Release APK
        working-directory: randomread
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#randomread-}
          mv randomread/app/build/outputs/apk/release/app-release.apk \
             randomread/app/build/outputs/apk/release/RandomRead-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📚 RandomRead ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📚 RandomRead

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 📂 epub / txt 파일 여러 개 동시 추가
            - 🎲 랜덤 뽑기
            - 가나다순 정렬 (EPUB → TXT 순)
            - 목록 txt 파일 내보내기
            - 오프라인 완전 동작 / 목록 영구 저장
          files: randomread/app/build/outputs/apk/release/RandomRead-*.apk
          draft: false
          prerelease: false
