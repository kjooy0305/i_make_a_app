name: "[하루 정리] Build & Release APK"

on:
  push:
    tags:
      - 'dayclean-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x dayclean/gradlew

      - name: Build Release APK
        working-directory: dayclean
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#dayclean-}
          mv dayclean/app/build/outputs/apk/release/app-release.apk \
             dayclean/app/build/outputs/apk/release/DayClean-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📝 하루 정리 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📝 하루 정리

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 지금 해야 할 것(•), 오늘 안에(-), 메모(=)를 나눠 적는 기록장
            - 아침 정리 · 저녁 정리 · 회고 시간에 맞춰 알림과 정리 화면이 바로 열림
            - 항목마다 따로 울리는 10분 반복 알림과 알림 쉬는 시간(구간·요일)
            - 매일 00시에 기록장을 메모리로 옮기고, 메모리 검색과 txt 내보내기·불러오기
            - 장기 목표(1주·1달·1년) 점검과 D-day, 글씨 크기 조절
            - 흑백 화면, 앱이 꺼져 있어도 알림
          files: dayclean/app/build/outputs/apk/release/DayClean-*.apk
          draft: false
          prerelease: false
