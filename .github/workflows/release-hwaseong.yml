name: "[화성그냥드림] Build & Release APK"

on:
  push:
    tags:
      - 'hwaseong-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: hwaseong/web
        run: npm ci

      - name: Build web app
        working-directory: hwaseong/web
        run: npm run build

      - name: Copy dist to Android assets
        run: |
          rm -rf hwaseong/android/app/src/main/assets/www/*
          cp -r hwaseong/web/dist/. hwaseong/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x hwaseong/android/gradlew

      - name: Build Release APK
        working-directory: hwaseong/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#hwaseong-}
          mv hwaseong/android/app/build/outputs/apk/release/app-release.apk \
             hwaseong/android/app/build/outputs/apk/release/HwaseongJustDream-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "화성 그냥드림 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 화성형 그냥드림 통합 운영 플랫폼

            > **설치 기기:** Android 8.0(API 26) 이상

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. Android → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치
          files: hwaseong/android/app/build/outputs/apk/release/HwaseongJustDream-*.apk
          draft: false
          prerelease: false
