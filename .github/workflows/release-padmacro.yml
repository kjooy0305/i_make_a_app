name: "[패드 매크로] Build & Release"

on:
  push:
    tags:
      - 'padmacro-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x padmacro/android/gradlew

      - name: Unit tests + Build Release APK
        working-directory: padmacro/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#padmacro-}
          mkdir -p dist
          mv padmacro/android/app/build/outputs/apk/release/app-release.apk dist/PadMacro-${VER}.apk
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🎯 패드 매크로 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎯 패드 매크로 (PadMacro)

            패드·폰에서 터치를 대신 해 주는 매크로(오토 마우스) 앱. 탭·길게 누르기·스와이프·대기·화면 캡쳐·글자 찾아 누르기·앱 실행·뒤로/홈 같은 단계를 순서대로 모아 반복 실행합니다. 터치를 그대로 따라 하는 녹화도 됩니다.

            ### 설치 (Android 8.0 이상, 캡쳐는 11 이상)
            1. `PadMacro-*.apk` 내려받아 설치 (설정 > 보안 > 알 수 없는 앱 허용)
            2. 앱 열기 → **[접근성 설정 열기]** → **‘패드 매크로 (자동 터치)’** 켜기
            3. 안드로이드 13+ 에서 “제한된 설정”이면: 설정 › 애플리케이션 › 패드 매크로 › ⋮ › **제한된 설정 허용** 후 다시 켜기
            4. (선택) **다른 앱 위에 표시** 허용 — 좌표 찍기·녹화 뒤 앱으로 자동 복귀, ‘앱 실행’ 단계에 필요

            ### 사용
            - **＋ 새 매크로** → 단계 추가. 좌표는 **화면에서 찍기** 로 원하는 앱 위에서 직접 누르거나, **● 터치 녹화** 로 실제 터치를 그대로 기록
            - 실행 설정: 반복 횟수(0 = 무한) · 단계 사이 대기 · 시작 전 대기 · 반복 사이 대기
            - 돌릴 앱을 열고 플로팅 패널 **▶** (또는 볼륨 아래 두 번) → 중지는 **■**
            - **화면 캡쳐** 단계는 갤러리 › Pictures/패드매크로 에 PNG 저장

            데이터는 기기 안에만 저장되며 어디에도 보내지 않습니다.
          files: dist/PadMacro-*.apk
          draft: false
          prerelease: false
