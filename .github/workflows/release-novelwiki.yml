name: "[NovelWiki] Build & Release APK"

on:
  push:
    tags:
      - 'novelwiki-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy web source to Android assets
        run: cp -r novelwiki/web/. novelwiki/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x novelwiki/android/gradlew

      - name: Build Release APK
        working-directory: novelwiki/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#novelwiki-}
          mv novelwiki/android/app/build/outputs/apk/release/app-release.apk \
             novelwiki/android/app/build/outputs/apk/release/NovelWiki-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📖 소설 창작 위키 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📖 소설 창작 위키 (NovelWiki)

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 📝 캐릭터·세계관·국가·종족·길드 등 창작 데이터 통합 관리
            - 🏰 탑 등반물 전용 — 층·부층·게이트·별자리·신 관리
            - 🌳 가계도, 이벤트 그래프, 타임라인 시각화
            - 🎯 퀘스트·아이템·스킬·직업·함정 등 게임 요소
            - 📚 소설 뷰어 (집필한 내용 읽기 모드)
            - 🔍 전체 검색 / 즐겨찾기 / 미리알림
            - 오프라인 완전 동작 / IndexedDB 영구 저장
          files: novelwiki/android/app/build/outputs/apk/release/NovelWiki-*.apk
          draft: false
          prerelease: false
