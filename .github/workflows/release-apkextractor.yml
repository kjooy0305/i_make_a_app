name: "[APK 추출기] Build & Release APK"

on:
  push:
    tags:
      - 'apkextractor-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x apkextractor/gradlew

      - name: Build Release APK
        working-directory: apkextractor
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#apkextractor-}
          mv apkextractor/app/build/outputs/apk/release/app-release.apk \
             apkextractor/app/build/outputs/apk/release/APKExtractor-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📦 APK 추출기 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📦 APK 추출기

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 설치된 앱 목록에서 골라 APK 파일로 추출
            - 여러 파일로 나뉜 앱은 .apks 하나로 묶기
            - 앱 이름·패키지 검색, 시스템 앱 포함 여부 선택
            - 저장 위치: 다운로드/APK추출기
          files: apkextractor/app/build/outputs/apk/release/APKExtractor-*.apk
          draft: false
          prerelease: false
