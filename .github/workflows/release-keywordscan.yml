name: "[KeywordScan] Build & Release APK"

on:
  push:
    tags:
      - 'keywordscan-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy web source to Android assets
        run: cp -r keywordscan/web/. keywordscan/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x keywordscan/android/gradlew

      - name: Build Release APK
        working-directory: keywordscan/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#keywordscan-}
          mv keywordscan/android/app/build/outputs/apk/release/app-release.apk \
             keywordscan/android/app/build/outputs/apk/release/KeywordScan-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🔎 소설 키워드 분석기 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔎 소설 키워드 분석기 (KeywordScan)

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 📂 TXT·ePub 대량 업로드 (100개 이상 가능, 순차 처리 대기열)
            - ⚡ 수십 개 키워드를 본문 1회 스캔으로 동시 집계 (유의어 합산)
            - 📊 1만자당 빈도(밀도) + 소설 구간별 분포(분산/집중) 분석
            - 🏷 임계 횟수에 따라 파일명 태그 `(!)` / `(?)` 자동 생성
            - ⚠️ 유사 파일명 중복 경고 (덮어쓰기 / 이름 변경 후 추가 / 취소)
            - 🔍 상위 키워드 중심 검색 + 하위 키워드 상세 표시
            - 💚🚫 호감 / 일반 / 불호 키워드 구분 표시
            - 🔄 키워드 추가·수정 후 기존 파일 재분석
            - 오프라인 완전 동작 / IndexedDB 영구 저장
          files: keywordscan/android/app/build/outputs/apk/release/KeywordScan-*.apk
          draft: false
          prerelease: false
