name: "[MusicList] Build & Release APK"

on:
  push:
    tags:
      - 'musiclist-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy web source to Android assets
        run: cp -r musiclist/web/. musiclist/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x musiclist/android/gradlew

      - name: Build Release APK
        working-directory: musiclist/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#musiclist-}
          mv musiclist/android/app/build/outputs/apk/release/app-release.apk \
             musiclist/android/app/build/outputs/apk/release/MusicList-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🎵 음악 이름 관리 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎵 음악 이름 관리 (MusicList)

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 📂 음악 파일을 여러 개 골라 이름만 목록으로 저장 (파일은 복사하지 않아요)
            - ⚠️ 같은 이름: 따로 저장 / 덮어쓰기 / 지우기
            - ≈ 비슷한 이름: 다른 음악인지 확인 후 "비슷한 노래 묶음"으로 보관
            - 🔍 이름·가수 검색, 최근 추가 / 제목순 / 가수순 정렬
            - ✏️ 이름·가수 수정, 삭제, 묶음에서 빼기
            - 📄 목록 txt 추출 · 이름 복사 (이름만 / 가수 - 이름 / 확장자 포함)
            - 오프라인 완전 동작 / 기기 안에 저장
          files: musiclist/android/app/build/outputs/apk/release/MusicList-*.apk
          draft: false
          prerelease: false
