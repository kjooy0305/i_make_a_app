name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/TRPG-make123-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스크립트 TRPG 작성 앱 ${{ github.ref_name }}
          body: |
            ## 스크립트 TRPG 작성 앱 ${{ github.ref_name }}

            ### 설치 방법
            1. `TRPG-make123-${{ github.ref_name }}.apk` 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 기능
            - 📜 TRPG 시나리오 작성 (씬 카드 에디터)
            - 🎲 주사위 시스템 (d4~d100)
            - 👤 캐릭터 시트 (능력치·신체·커스텀 바)
            - 🔍 내장 시나리오: 독스프 (크툴루 밀실 탈출 ~71씬)
            - 💕 솔로 플레이 (8명 캐릭터·호감도·히든 루트)
            - 오프라인 완전 동작
          files: app/build/outputs/apk/release/TRPG-make123-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
