name: "[RepeatAlarm] Build & Release APK"

on:
  push:
    tags:
      - 'repeatalarm-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x repeatalarm/gradlew

      - name: Build Release APK
        working-directory: repeatalarm
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#repeatalarm-}
          mv repeatalarm/app/build/outputs/apk/release/app-release.apk \
             repeatalarm/app/build/outputs/apk/release/RepeatAlarm-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "⏰ 반복 알림 앱 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## ⏰ 반복 알림 앱 (RepeatAlarm)

            > **설치 기기:** Android 5.0(API 21) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - ⏰ 반복 알림 설정 (요일·시간·간격 조합)
            - 📂 알림 그룹 관리
            - 🔔 부팅 후 자동 복구 (BootReceiver)
            - 🎵 커스텀 알림음 설정
            - 오프라인 완전 동작 / Room DB 영구 저장
          files: repeatalarm/app/build/outputs/apk/release/RepeatAlarm-*.apk
          draft: false
          prerelease: false
