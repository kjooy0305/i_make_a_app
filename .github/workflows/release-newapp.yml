name: "[NewApp] Build & Release APK"

on:
  push:
    tags:
      - 'newapp-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.p12

      - name: Grant execute permission for gradlew
        run: chmod +x newapp/android/gradlew

      - name: Build Release APK
        working-directory: newapp/android
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          VER=${TAG#newapp-}
          mv newapp/android/app/build/outputs/apk/release/app-release.apk \
             newapp/android/app/build/outputs/apk/release/NewApp-${VER}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📖 NewApp ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📖 NewApp — 스토리 팩 에디터

            > **설치 기기:** Android 8.0(API 26) 이상 스마트폰·태블릿

            ### 설치 방법
            1. 아래 `.apk` 파일 다운로드
            2. 안드로이드 → **설정 > 보안 > 알 수 없는 앱 허용** 활성화
            3. APK 파일 실행 후 설치

            ### 주요 기능
            - 📦 이벤트 팩 단위 관리 (메인/공용/지역)
            - 🎲 동적 이벤트 셔플 규칙 설정
            - 🔗 그래프 기반 스토리 에디터
            - 💾 JSON 내보내기/불러오기
            - 🎛 드롭다운 기반 조건·보상 설정
            - 오프라인 완전 동작 / 로컬 저장
          files: newapp/android/app/build/outputs/apk/release/NewApp-*.apk
          draft: false
          prerelease: false
