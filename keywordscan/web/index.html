<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소설 키워드 분석기</title>
<style>
:root{
  --bg:#1a1a2e;--bg2:#16213e;--card:#1f2a4a;--line:#2f3d66;--txt:#e8ebf7;--sub:#9aa5c8;
  --pri:#7c3aed;--pri2:#a78bfa;--like:#34d399;--norm:#94a3b8;--hate:#f87171;--warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column}
header{background:var(--bg2);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));font-weight:700;font-size:17px;border-bottom:1px solid var(--line)}
header small{color:var(--sub);font-weight:400;margin-left:8px;font-size:12px}
main{flex:1;overflow-y:auto;padding:12px 14px 90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:11px 4px;font-size:13px;position:relative}
nav button.on{color:var(--pri2);font-weight:700}
nav .badge{position:absolute;top:5px;margin-left:2px;background:var(--pri);color:#fff;border-radius:9px;font-size:10px;padding:0 6px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--txt)}
textarea{min-height:160px;font-family:monospace;font-size:12px}
button.btn{background:var(--pri);border:0;color:#fff;border-radius:8px;padding:9px 14px;font-weight:600}
button.btn.sec{background:var(--line)}
button.btn.dng{background:#b91c1c}
button.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.muted{color:var(--sub);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 10px;margin:3px 4px 3px 0;font-size:13px}
.chip.sel{background:var(--pri);border-color:var(--pri)}
.chip.up{border-color:var(--pri2);color:var(--pri2)}
.chip.up.bang{background:rgba(124,58,237,.25)}
.chip.like{border-color:var(--like);color:var(--like)}
.chip.normal{border-color:var(--norm);color:#cbd5e1}
.chip.dislike{border-color:var(--hate);color:var(--hate)}
.chip b{font-weight:700}
.tn{font-size:12px;color:var(--sub);margin-top:8px}
.tn.like{color:var(--like)}.tn.dislike{color:var(--hate)}
.title{font-weight:700;word-break:break-all}
.tagname{font-size:12px;color:var(--pri2);word-break:break-all;margin:2px 0 4px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 12px;text-align:center;color:var(--sub);margin:6px 0}
.drop.over{border-color:var(--pri2);background:rgba(124,58,237,.12);color:var(--txt)}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri2);width:0}
.dist{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle;margin-left:6px}
.dist i{display:block;width:5px;background:var(--pri2);border-radius:1px;min-height:1px}
.dist i.z{background:var(--line)}
.banner{background:rgba(251,191,36,.12);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px;margin:8px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{flex:1;background:none;border:0;padding:8px;color:var(--sub)}
.seg button.on{background:var(--pri);color:#fff}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal>div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#0f172a;border:1px solid var(--line);padding:8px 16px;border-radius:20px;z-index:30;display:none;font-size:13px;max-width:90vw}
.err{color:var(--hate)}
.ok{color:var(--like)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;font-size:13px}
.cmp>div{background:var(--bg);border-radius:8px;padding:8px;word-break:break-all}
.kwrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.kwrow:last-child{border-bottom:0}
h4{margin:14px 0 4px}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:15}
#loading .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px 26px;min-width:220px;max-width:90vw;text-align:center}
#loading .msg{margin-top:12px;font-size:14px}
.spin{width:38px;height:38px;margin:0 auto;border:4px solid var(--line);border-top-color:var(--pri2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>🔎 소설 키워드 분석기<small id="stat"></small></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modalRoot"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
