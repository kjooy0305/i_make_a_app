<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>광고 건너뛰기</title>
<style>
  body { width: 260px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #000; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .count { font-size: 32px; font-weight: 700; margin: 6px 0 12px; }
  .count small { font-size: 13px; font-weight: 400; color: #555; margin-left: 4px; }
  label { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #eee; cursor: pointer; }
  label:first-of-type { border-top: 0; }
  input { accent-color: #000; width: 16px; height: 16px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; border: 1px solid #000; background: #fff; color: #000; padding: 7px 0; border-radius: 6px; cursor: pointer; font: inherit; }
  button.primary { background: #000; color: #fff; }
  a { color: #000; }
  .hint { color: #555; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>광고 건너뛰기</h1>
  <div class="count"><span id="count">0</span><small>개 건너뜀</small></div>
  <label><input type="checkbox" id="enabled"> 켜기</label>
  <label><input type="checkbox" id="fastForward"> 버튼 없는 광고는 끝으로 넘기기</label>
  <label><input type="checkbox" id="hideBanners"> 배너·추천 광고 칸 숨기기</label>
  <label><input type="checkbox" id="autoResume"> "이어서 시청하시겠어요?" 창 자동 확인</label>
  <label><input type="checkbox" id="badge"> 건너뛸 때 작게 알려 주기</label>
  <div class="row">
    <button id="reset">횟수 초기화</button>
    <button id="open" class="primary">유튜브 열기</button>
  </div>
  <div class="hint">건너뛰기 버튼을 누를 때 크롬 위에 "디버깅 중" 띠가 잠깐 보이는 건 정상입니다(진짜 클릭을 보내는 중). 설정은 바로 적용됩니다. <a href="https://kjooy0305.github.io/i_make_a_app/adskip/" target="_blank">원리와 폰용 앱 보기</a></div>
  <script src="popup.js"></script>
</body>
</html>
