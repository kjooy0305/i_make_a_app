<!doctype html>
<!-- 유튜브 플레이어 흉내: 광고 중이면 #movie_player 에 ad-showing, 1.5초 뒤 '광고 건너뛰기' 버튼이 뜬다.
     버튼이 눌리거나 광고 영상이 끝나면 광고가 끝나고 ad-showing 이 빠진다. content.js 검증용. -->
<html lang="ko"><head><meta charset="utf-8"><title>fake player</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  #movie_player { position: relative; width: 320px; height: 180px; background: #000; }
  video { width: 320px; height: 180px; }
  .ytp-ad-skip-button-slot { position: absolute; right: 8px; bottom: 8px; display: none; }
  .ad-showing .ytp-ad-skip-button-slot.ready, .ytp-ad-skip-button-slot.stale { display: block; }
  .ytp-ad-overlay-close-button { display: none; }
  ytd-ad-slot-renderer { display: block; background: #fc0; padding: 6px; margin-top: 10px; }
  #log { white-space: pre; font-size: 12px; margin-top: 10px; }
</style></head>
<body>
<div id="movie_player" class="html5-video-player">
  <video id="v" muted playsinline></video>
  <div class="ytp-ad-skip-button-slot"><button class="ytp-skip-ad-button" id="skipbtn"><span>광고 건너뛰기</span></button></div>
  <!-- 실제 유튜브처럼 종료 화면 버튼도 플레이어 안에 있다 -->
  <div class="ytp-ad-module"><div id="endcard" style="display:none;position:absolute;left:8px;top:8px;color:#fff">광고 종료 화면 <button class="ytp-skip-ad-button" id="endskip"><div class="ytp-skip-ad-button__text">건너뛰기</div></button></div></div>
</div>
<ytd-ad-slot-renderer>배너 광고</ytd-ad-slot-renderer>
<tp-yt-paper-dialog id="pausedlg" style="display:none;position:fixed;top:40px;left:40px;background:#fff;border:1px solid #000;padding:12px">
  <yt-confirm-dialog-renderer>
    <div id="title">동영상이 일시중지되었습니다. 이어서 시청하시겠어요?</div>
    <div id="buttons"><yt-button-renderer id="cancel-button"><button>아니요</button></yt-button-renderer><yt-button-renderer id="confirm-button"><button>예</button></yt-button-renderer></div>
  </yt-confirm-dialog-renderer>
</tp-yt-paper-dialog>
<div id="log"></div>
<script>
  var p = document.getElementById('movie_player'), v = document.getElementById('v');
  var slot = document.querySelector('.ytp-ad-skip-button-slot'), logEl = document.getElementById('log');
  window.events = [];
  function log(s) { events.push(s); logEl.textContent += s + '\n'; }
  var skipTimer = null;
  function endAd(reason) {
    if (!p.classList.contains('ad-showing')) return;
    clearTimeout(skipTimer);
    slot.classList.remove('ready');
    p.classList.remove('ad-showing');
    log('ad-ended:' + reason + ':t=' + v.currentTime.toFixed(1));
    v.removeAttribute('src'); v.load();
    if (window.staleButtonMode) {
      // 접힌 탭의 유튜브처럼: 광고는 끝났는데 건너뛰기 버튼이 화면에 그대로 남아 있고, 본영상이 재생 중이다.
      // 이때 버튼을 또 누르면 본영상 위를 클릭한 것 = 일시정지.
      slot.classList.add('ready'); slot.classList.add('stale');
      v.src = 'ad.webm'; v.play().catch(function(){}); log('main-playing');
      setTimeout(function () { slot.classList.remove('ready'); slot.classList.remove('stale'); log('stale-button-gone'); }, 2000);
    }
  }
  // 광고 시작: 영상 로드, 재생, buttonDelay 뒤 버튼 활성화. buttonDelay=0 이면 버튼 없는 광고.
  window.startAd = function (buttonDelay) {
    v.src = 'ad.webm'; v.muted = false; v.currentTime = 0; v.play().catch(function () {});
    p.classList.add('ad-showing');
    log('ad-started');
    if (buttonDelay > 0) skipTimer = setTimeout(function () { slot.classList.add('ready'); log('skip-button-shown'); }, buttonDelay);
  };
  // 일시중지 확인 창 흉내: 영상을 멈추고 창을 띄운다. [예] → 창 닫힘(영상은 그대로 멈춘 채; 유튜브처럼), [아니요] → 로그만
  var endcard = document.getElementById('endcard');
  document.getElementById('endskip').addEventListener('click', function () { endcard.style.display = 'none'; log('endcard-skip-clicked'); });
  var dlg = document.getElementById('pausedlg');
  window.showPauseDialog = function () { v.src = 'ad.webm'; v.play().catch(function(){}); setTimeout(function(){ v.pause(); dlg.style.display = 'block'; log('pause-dialog-shown'); }, 300); };
  dlg.querySelector('#confirm-button button').addEventListener('click', function () { dlg.style.display = 'none'; log('pause-dialog-yes'); });
  dlg.querySelector('#cancel-button button').addEventListener('click', function () { dlg.style.display = 'none'; log('pause-dialog-no'); });
  document.getElementById('skipbtn').addEventListener('click', function () {
    if (slot.classList.contains('stale')) { v.pause(); log('stale-clicked-paused'); return; }
    log('skip-clicked'); endAd('click');
  });
  v.addEventListener('ended', function () { endAd('ended'); });
  v.addEventListener('seeked', function () { if (p.classList.contains('ad-showing') && v.duration && v.currentTime >= v.duration - 0.5) log('seeked-near-end:t=' + v.currentTime.toFixed(1) + ':rate=' + v.playbackRate); });
</script>
</body></html>
