<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 정리 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: 시안 모음. 위에 화면 고르는 줄, 가운데에 폰 비율(390×844) 한 대, 또는 전체 보기에서는 폰 여러 대를 격자로 놓는다. */
:root {
  --paper: #ffffff;      /* 종이 */
  --ink: #000000;        /* 선과 글씨 */
  --carry: #fff3a8;      /* 넘긴 기록. 흑백 규칙의 유일한 예외 */
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; text-wrap: balance; }
.head p { margin: 4px 0 0; max-width: 62ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip, .mode button {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--ink); border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer;
}
.chip[aria-pressed="true"], .mode button[aria-pressed="true"] { border-width: 3px; padding: 4px 10px; font-weight: 700; }
.mode { display: flex; gap: 8px; margin-left: auto; }
.chip:focus-visible, .mode button:focus-visible, .btn:focus-visible, .seg button:focus-visible, .banner:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.stage { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
.cell { display: grid; gap: 8px; justify-items: center; }
.cell figcaption { font-weight: 700; }
figure { margin: 0; }
.slot { position: relative; }
.phone-scale { transform-origin: top left; }
.note { max-width: 62ch; margin: 0 auto; text-align: center; }

/* ===== 폰 ===== */
.phone {
  width: 390px; height: 844px; background: var(--paper); border: 2px solid var(--ink); border-radius: 38px;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.status { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 8px 24px 0; font-family: var(--font-num); font-size: calc(12px * var(--fs, 1)); font-weight: 800; flex: none; }
.gesture { height: 20px; display: flex; justify-content: center; align-items: center; flex: none; }
.gesture i { width: 120px; border-top: 3px solid var(--ink); border-radius: 3px; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
.pad { padding: 0 16px; }

.btn {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--ink); border-radius: 12px; padding: 0 12px; min-height: 44px; min-width: 44px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary { border-width: 3px; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; font-size: calc(13px * var(--fs, 1)); padding: 0 10px; }
.dday { font-family: var(--font-num); font-weight: 800; }

/* 위쪽 막대 */
.topbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px 8px; flex: none; }
.topbar h2 { margin: 0; font-size: calc(18px * var(--fs, 1)); font-weight: 900; flex: 1; letter-spacing: -0.01em; }
.sub { font-size: calc(12px * var(--fs, 1)); }

/* 홈 */
.date { text-align: center; padding: 6px 16px 10px; flex: none; }
.date b { display: block; font-size: calc(26px * var(--fs, 1)); font-weight: 900; letter-spacing: -0.03em; }
.date span { font-size: calc(13px * var(--fs, 1)); }
.navrow { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; flex: none; }
.navrow .spacer { flex: 1; }
.banner {
  margin: 0 16px 10px; text-align: left; font: inherit; font-weight: 700; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; flex: none;
}
.journal { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.composer { padding: 10px 16px; border-bottom: 1px solid var(--ink); flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-width: 3px; font-weight: 700; }
.field { display: flex; gap: 8px; }
.field input, .field textarea {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--ink); border-radius: 10px; padding: 0 12px; min-height: 44px;
}
.field textarea { padding: 10px 12px; resize: none; }
::placeholder { color: var(--ink); opacity: 0.55; }
.hint { font-size: calc(12px * var(--fs, 1)); }
.hint u { text-underline-offset: 3px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
.group { margin: 12px 0 2px; font-size: calc(12px * var(--fs, 1)); font-weight: 700; letter-spacing: 0.04em; border-bottom: 2px solid var(--ink); padding-bottom: 3px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid var(--ink); }
.item .glyph { font-family: var(--font-num); font-weight: 800; width: 16px; text-align: center; flex: none; }
.item .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .meta { font-family: var(--font-num); font-size: calc(12px * var(--fs, 1)); flex: none; text-align: right; }
.item.carry { background: var(--carry); margin: 0 -16px; padding: 6px 16px; }
.item.done .txt { text-decoration: line-through; }
.chk { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--paper); cursor: pointer; padding: 0; font: inherit; color: var(--ink); font-weight: 900; }
.chk[aria-pressed="true"]::after { content: "✓"; }
.chk:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.lockline { border: 1.5px dashed var(--ink); border-radius: 10px; padding: 10px 12px; text-align: center; }

/* 설정 */
.sec { margin: 14px 0 4px; font-weight: 900; font-size: calc(15px * var(--fs, 1)); border-bottom: 2px solid var(--ink); padding-bottom: 3px; }
.row2 { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--ink); }
.row2 .grow { flex: 1; min-width: 0; }
.row2 .grow b { display: block; }
.row2 small { font-size: calc(12px * var(--fs, 1)); }
.tag { display: inline-block; border: 1px solid var(--ink); border-radius: 6px; padding: 0 6px; font-size: calc(11px * var(--fs, 1)); font-weight: 700; margin-left: 6px; }
.time { font-family: var(--font-num); font-weight: 800; font-size: calc(18px * var(--fs, 1)); }
.days { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.days span { width: 30px; height: 30px; border: 1px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: calc(12px * var(--fs, 1)); }
.days span.on { border-width: 3px; font-weight: 700; }

/* 메모리 */
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 12px; flex: none; }
.grid4 .btn { min-height: 56px; text-align: center; line-height: 1.25; }
.tree { font-size: calc(13px * var(--fs, 1)); }
.tree .d { font-weight: 900; font-size: calc(15px * var(--fs, 1)); margin-top: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
.tree .l1 { margin-left: 8px; border-left: 1px solid var(--ink); padding-left: 10px; margin-top: 4px; }
.tree .l1 > b::before { content: "ㄴ "; font-weight: 400; }
.tree .l2 { margin-left: 8px; border-left: 1px solid var(--ink); padding: 0 0 0 10px; }
.tree .l2 .t { font-family: var(--font-num); font-size: calc(12px * var(--fs, 1)); }
.tree .l3 { margin-left: 8px; border-left: 1px solid var(--ink); padding-left: 10px; margin-bottom: 4px; }

/* 장기 목표 */
.top3 { border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; }
.top3 h3 { margin: 0 0 4px; font-size: calc(13px * var(--fs, 1)); }
.goal { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--ink); }
.goal:last-child { border-bottom: 0; }
.goal .dd { font-family: var(--font-num); font-weight: 800; width: 52px; flex: none; }
.goal .gd { font-family: var(--font-num); font-size: calc(12px * var(--fs, 1)); width: 84px; flex: none; }
.stick { position: sticky; top: 0; background: var(--paper); z-index: 2; border-bottom: 2px solid var(--ink); padding: 8px 0; display: grid; gap: 6px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tabs button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; min-height: 42px; cursor: pointer; }
.tabs button[aria-pressed="true"] { border-width: 3px; font-weight: 700; }
.sorts { display: flex; gap: 6px; overflow-x: auto; }
.sorts button { font: inherit; font-size: calc(12px * var(--fs, 1)); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; padding: 0 10px; min-height: 34px; white-space: nowrap; cursor: pointer; }
.sorts button[aria-pressed="true"] { border-width: 3px; font-weight: 700; }
.steps { display: flex; gap: 6px; padding: 0 16px 8px; flex: none; }
.steps span { flex: 1; text-align: center; border: 1px solid var(--ink); border-radius: 8px; padding: 4px 0; font-size: calc(12px * var(--fs, 1)); }
.steps span.on { border-width: 3px; font-weight: 700; }
.acts { display: flex; gap: 6px; margin-top: 6px; }
.acts .btn { flex: 1; min-height: 38px; font-size: calc(13px * var(--fs, 1)); }
.card { border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.bottom { padding: 10px 16px; border-top: 2px solid var(--ink); flex: none; }

/* 알림 */
.shade { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px; display: grid; gap: 8px; align-content: start; }
.notif { border: 1.5px solid var(--ink); border-radius: 16px; padding: 10px 12px; }
.notif .app { font-size: calc(11px * var(--fs, 1)); display: flex; justify-content: space-between; }
.notif b { display: block; font-size: calc(15px * var(--fs, 1)); margin: 2px 0 6px; }
.notif .btn { min-height: 36px; font-size: calc(13px * var(--fs, 1)); }
.cap { text-align: center; font-size: calc(12px * var(--fs, 1)); padding: 6px 16px; }


/* 스크롤: 폰처럼 얇은 막대로 보여 준다 */
.scroll, .list { scrollbar-width: thin; scrollbar-color: var(--ink) var(--paper); }
.scroll::-webkit-scrollbar, .list::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 3px; }
.scroll::-webkit-scrollbar-track, .list::-webkit-scrollbar-track { background: var(--paper); }

/* 검색 */
.searchbox { display: flex; gap: 8px; padding: 0 16px 10px; flex: none; }
.searchbox input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 0 12px; min-height: 46px; }
.mcount { padding: 0 16px 6px; font-size: calc(12px * var(--fs, 1)); font-weight: 700; flex: none; display: flex; justify-content: space-between; }
.empty { border: 1.5px dashed var(--ink); border-radius: 12px; padding: 18px 12px; text-align: center; margin-top: 12px; }
mark { background: var(--paper); color: var(--ink); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 2px; font-weight: 900; }

/* 요일 고르기 */
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 6px 0; }
.daypick button { aspect-ratio: 1; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 50%; cursor: pointer; padding: 0; min-width: 40px; }
.daypick button[aria-pressed="true"] { border-width: 3px; font-weight: 700; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.quick button { font: inherit; font-size: calc(13px * var(--fs, 1)); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; min-height: 36px; padding: 0 12px; cursor: pointer; }
.timebox { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.timebox .btn { flex-direction: column; min-height: 72px; gap: 0; }
.timebox small { font-size: calc(12px * var(--fs, 1)); font-weight: 400; }
.timebox .time { font-size: calc(26px * var(--fs, 1)); }

@media (prefers-reduced-motion: no-preference) { .phone-scale { transition: none; } }

/* 스위치 */
.switch { width: 58px; height: 34px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); position: relative; cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); }
.switch[aria-pressed="true"] { border-width: 4px; }
.switch[aria-pressed="true"]::after { left: 26px; background: var(--ink); }
.switch:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.fssample { border: 1.5px dashed var(--ink); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }

/* 아래에서 올라오는 시트 */
.scrim { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.86); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 3px solid var(--ink); border-radius: 22px 22px 0 0; padding: 14px 16px 22px; display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 16px; font-weight: 900; }
.sheet .grip { width: 48px; border-top: 3px solid var(--ink); margin: -4px auto 4px; border-radius: 3px; }
.sheet .acts { margin-top: 2px; }
.optrow { display: grid; gap: 6px; }
.opt { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--ink); border-radius: 10px; min-height: 44px; padding: 0 12px; font: inherit; color: var(--ink); background: var(--paper); cursor: pointer; text-align: left; }
.opt[aria-pressed="true"] { border-width: 3px; font-weight: 700; }

/* 날짜 입력과 달력 */
.dfields { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.dfields label { display: grid; gap: 2px; font-size: 12px; }
.dfields input { font: inherit; font-family: var(--font-num); font-weight: 800; font-size: 22px; text-align: center; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; min-height: 52px; width: 100%; min-width: 0; }
.dtext { font-weight: 900; font-size: 18px; margin: 8px 0 0; }
.dbad { font-weight: 700; margin: 8px 0 0; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; }
.mockbox { border: 1.5px dashed var(--ink); border-radius: 12px; padding: 8px 12px; margin-top: 14px; display: grid; gap: 6px; }
.mockbox input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px; min-height: 40px; padding: 0 10px; }
.calhead { display: flex; align-items: center; gap: 8px; }
.calhead b { flex: 1; text-align: center; font-size: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.cal .wd { text-align: center; font-size: 12px; font-weight: 700; padding: 4px 0; border-bottom: 2px solid var(--ink); }
.cal button { aspect-ratio: 1; min-height: 44px; font: inherit; font-family: var(--font-num); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; cursor: pointer; padding: 0; }
.cal button.today { border-style: dashed; border-width: 2px; }
.cal button.sel { border-width: 4px; font-weight: 800; }
.cal button:disabled { border-color: transparent; text-decoration: line-through; cursor: default; }
.cal .blank { visibility: hidden; }
.morerow { text-align: center; padding: 10px 0 2px; font-size: 12px; }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <h1>하루 정리 화면 시안</h1>
    <p>폰 비율(390×844, 약 19.5:9)로 맞춘 임시 화면입니다. 버튼 위치와 각 창의 구성만 확인하는 용도이고, 저장이나 알림은 동작하지 않습니다. 폰 안의 버튼을 눌러 화면을 이동해 볼 수 있고, 체크, 글씨 크기, 장기 목표 끄기, 날짜 계산, 검색은 실제로 움직입니다.</p>
  </header>
  <div class="bar" id="bar" role="group" aria-label="화면 고르기"></div>
  <div class="stage" id="stage"></div>
  <p class="note">색은 흰 바탕에 검은 선과 글씨만 쓰고, 넘긴 기록만 연노랑입니다. 알림 쉬는 시간, 정리 시간 추가, 목표 작성은 설정과 장기 목표 안에서 열립니다.</p>
</div>

<script>
(function () {
  var W = 390, H = 844;
  var weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  function z(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '.' + z(d.getMonth() + 1) + '.' + z(d.getDate()); }
  function iso(d) { return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function esc(x) { return String(x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  // ---------- 상태 ----------
  var S = {
    fs: 1, goalsOn: true,
    baseISO: '',                // 시안 확인용: 작성하는 날을 바꿔 계산해 보기
    period: '1m', dY: 0, dM: 0, dD: 0,
    calY: 0, calM: 0,
    gtab: 'all', gsort: 'soon',
    gcStep: 0,
    editId: 0,
    mdesc: true, mdone: 'written'
  };
  function realToday() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function today() {
    if (S.baseISO) { var p = S.baseISO.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    return realToday();
  }
  function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
  function dText(n) { return n === 0 ? 'D-DAY' : (n > 0 ? 'D-' + n : 'D+' + (-n)); }

  // ---------- 날짜 규칙 ----------
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function lastDayOf(y, m) { return new Date(y, m + 1, 0).getDate(); }
  // 1달: 같은 날짜. 오늘이 그 달의 마지막 날이면 다음 달의 마지막 날. 없는 날짜(30일 → 2월)는 그 달 마지막 날.
  function addMonthRule(t) {
    var y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
    var isLast = d === lastDayOf(y, m);
    var ny = m === 11 ? y + 1 : y, nm = (m + 1) % 12, nl = lastDayOf(ny, nm);
    return new Date(ny, nm, isLast ? nl : Math.min(d, nl));
  }
  function calcDate(period, t) {
    if (period === '1w') return addDays(t, 7);       // 내일부터 7일 = 오늘 + 7일
    if (period === '1m') return addMonthRule(t);
    return addDays(t, 365);                          // 1년 = 365일
  }
  function setDateFields(d) { S.dY = d.getFullYear(); S.dM = d.getMonth() + 1; S.dD = d.getDate(); S.calY = S.dY; S.calM = S.dM - 1; }
  function fieldsDate() {
    var y = +S.dY, m = +S.dM, d = +S.dD;
    if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > lastDayOf(y, m - 1) || y < 2000 || y > 2100) return null;
    return new Date(y, m - 1, d);
  }

      return '<div class="screen">' +
      '<div class="topbar"><h2>저녁 정리 · 19:00</h2></div>' +
      '<div class="pad" style="padding-bottom:8px"><div class="lockline">지금은 체크만 할 수 있어요. 메모와 새 기록은 잠겨 있어요.</div></div>' +
      '<div class="scroll">' +
        '<div class="group"><span>• 지금</span></div>' + part('•').map(function (i) { return item(i); }).join('') +
        '<div class="group"><span>- 나중에</span></div>' + part('-').map(function (i) { return item(i); }).join('') +
        '<p class="hint" style="margin-top:12px">= 메모는 저녁 정리에 나오지 않아요.</p>' +
      '</div><div class="bottom"><button class="btn block primary" data-go="review">확인 · 저녁 정리 끝내기</button><p class="hint" style="margin:6px 0 0;text-align:center">끝내기 전에는 뒤로 갈 수 없어요.</p></div></div>'; } },

    { id: 'review', label: '회고', html: function () { return '<div class="screen">' +
      '<div class="topbar"><h2>회고 · 22:00</h2></div>' +
      '<div class="scroll">' +
        '<div class="group"><span>못한 일</span><span>' + CARRY_REVIEW.length + '개</span></div>' +
        CARRY_REVIEW.map(function (c) { return '<div class="card"><div>' + c[0] + ' ' + c[1] + '</div><div class="acts"><button class="btn">내일로 넘기기</button><button class="btn">끝내기</button></div></div>'; }).join('') +
        '<div class="group"><span>내일 할 일 미리 적기</span></div>' +
        seg(['• 지금', '- 나중에', '= 메모'], 0).replace('class="seg"', 'class="seg" style="margin:8px 0"') +
        '<div class="field"><input placeholder="내일 해야 할 것" aria-label="기록 내용"><button class="btn primary">추가</button></div>' +
        '<div class="group"><span>내일로 넘어가는 것</span><span>' + TOMORROW.length + '개</span></div>' +
        TOMORROW.map(function (a) { return '<div class="item carry"><span class="glyph">' + a[0] + '</span><span class="txt">' + a[1] + '</span><button class="btn small" aria-label="삭제">삭제</button></div>'; }).join('') +
      '</div><div class="bottom"><button class="btn block primary" data-go="home">회고 끝내기</button></div></div>'; } },

    { id: 'notif', label: '알림', html: function () {
      function n(app, time, title, btn) { return '<div class="notif"><div class="app"><span>하루 정리 · ' + app + '</span><span>' + time + '</span></div><b>' + title + '</b><button class="btn">' + btn + '</button></div>'; }
      return '<div class="screen">' +
      '<div class="date"><b>07:10</b><span>' + dateText + ' ' + weekText + '</span></div>' +
      '<div class="shade">' +
        n('지금 해야 할 것', '07:10', '• 보고서 초안 보내기', '완료') + n('지금 해야 할 것', '07:10', '• 약 먹기', '완료') +
        n('지금 해야 할 것', '07:10', '• 세탁소에 전화하기', '완료') + n('지금 해야 할 것', '07:10', '• 회의 자료 프린트하기', '완료') +
        n('오늘 안에', '19:10', '- 빨래 널기', '완료') + n('오늘 안에', '19:10', '- 택배 상자 정리', '완료') + n('오늘 안에', '19:10', '- 화분 물 주기', '완료') +
        n('정리 시간', '19:00', '저녁 정리 시간이에요', '열기') +
        '<p class="hint" style="text-align:center;margin:8px 0 0">항목마다 알림이 따로 울리고, 완료는 그 항목만 처리해요.<br>알림 쉬는 시간에는 울리지 않아요.</p>' +
      '</div></div>'; } }
  ];

  var bar = document.getElementById('bar');
  var stage = document.getElementById('stage');
  var current = 'home';
  var mode = 'one';

  function find(id) { return screens.filter(function (s) { return s.id === id; })[0]; }
  function phoneHtml(s) { return '<div class="phone" style="--fs:' + S.fs + '" data-screen="' + s.id + '">' + status + s.html() + gesture + '</div>'; }

  function render(keepScroll) {
    var saved = [];
    if (keepScroll) Array.prototype.forEach.call(stage.querySelectorAll('.scroll,.list,.shade'), function (e) { saved.push(e.scrollTop); });
    bar.innerHTML = '';
    screens.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = s.label;
      b.setAttribute('aria-pressed', String(mode === 'one' && s.id === current));
      b.addEventListener('click', function () { current = s.id; mode = 'one'; render(); });
      bar.appendChild(b);
    });
    var m = document.createElement('div'); m.className = 'mode';
    [['one', '하나씩'], ['all', '전체 보기']].forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = p[1];
      b.setAttribute('aria-pressed', String(mode === p[0]));
      b.addEventListener('click', function () { mode = p[0]; render(); });
      m.appendChild(b);
    });
    bar.appendChild(m);

    stage.innerHTML = '';
    var list = mode === 'one' ? [find(current)] : screens;
    var avail = Math.min(window.innerWidth - 32, 1180);
    var scale = mode === 'one' ? Math.min(1, avail / W) : (avail < 520 ? Math.min(1, avail / W) * 0.9 : 0.56);
    list.forEach(function (s) {
      var fig = document.createElement('figure'); fig.className = 'cell';
      var slot = document.createElement('div'); slot.className = 'slot';
      slot.style.width = Math.round(W * scale) + 'px';
      slot.style.height = Math.round(H * scale) + 'px';
      var scaler = document.createElement('div'); scaler.className = 'phone-scale';
      scaler.style.transform = 'scale(' + scale + ')';
      scaler.style.width = W + 'px'; scaler.style.height = H + 'px';
      scaler.innerHTML = phoneHtml(s);
      slot.appendChild(scaler);
      fig.appendChild(slot);
      var cap = document.createElement('figcaption'); cap.textContent = s.label;
      fig.appendChild(cap);
      stage.appendChild(fig);
    });
    if (keepScroll) Array.prototype.forEach.call(stage.querySelectorAll('.scroll,.list,.shade'), function (e, i) { if (saved[i] != null) e.scrollTop = saved[i]; });
  }

  function go(id) { current = id; mode = 'one'; render(); window.scrollTo({ top: 0 }); }

  function recompute() { setDateFields(calcDate(S.period, today())); }

  stage.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    var a;
    if (t.hasAttribute('data-clear')) {
      var box = t.parentElement.querySelector('input');
      box.value = ''; box.dispatchEvent(new Event('input', { bubbles: true })); box.focus();
      return;
    }
    if (t.classList.contains('dayt')) { t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); return; }
    if (t.hasAttribute('data-days')) {
      var want = t.getAttribute('data-days');
      Array.prototype.forEach.call(t.closest('.screen').querySelectorAll('.dayt'), function (b) { b.setAttribute('aria-pressed', String(want.indexOf(b.textContent) >= 0)); });
      return;
    }
    if (t.classList.contains('chk')) {
      // 체크 표시만 바꾼다. 목록 자리는 다른 화면으로 갔다 오면 옮겨진다.
      var it = byId(+t.getAttribute('data-id'));
      var on = t.getAttribute('aria-pressed') !== 'true';
      if (it) { it.done = on; it.t = on ? nowTime() : null; }
      t.setAttribute('aria-pressed', String(on));
      t.setAttribute('aria-label', on ? '해결 취소' : '완료');
      var row = t.closest('.item');
      if (row) { row.classList.toggle('done', on); var meta = row.querySelector('.meta'); if (meta) meta.textContent = on && it ? it.t : ''; }
      return;
    }
    if ((a = t.getAttribute('data-set'))) {
      var v = t.getAttribute('data-v');
      if (a === 'fs') S.fs = parseFloat(v);
      else if (a === 'goalsOn') S.goalsOn = !S.goalsOn;
      else if (a === 'mdesc') S.mdesc = v === '1';
      else if (a === 'mdone') S.mdone = v;
      render(true);
      return;
    }
    if (t.hasAttribute('data-gtab')) { S.gtab = t.getAttribute('data-gtab'); render(true); return; }
    if (t.hasAttribute('data-gsort')) { S.gsort = t.getAttribute('data-gsort'); render(true); return; }
    if (t.hasAttribute('data-period')) { S.period = t.getAttribute('data-period'); recompute(); render(true); return; }
    if (t.hasAttribute('data-cal-nav')) {
      var d = new Date(S.calY, S.calM + parseInt(t.getAttribute('data-cal-nav'), 10), 1);
      S.calY = d.getFullYear(); S.calM = d.getMonth(); render(true); return;
    }
    if (t.hasAttribute('data-cal-day')) { S.dY = S.calY; S.dM = S.calM + 1; S.dD = parseInt(t.getAttribute('data-cal-day'), 10); render(true); return; }
    if (t.hasAttribute('data-edit')) { S.editId = parseInt(t.getAttribute('data-edit'), 10); go('typeedit'); return; }
    if ((a = t.getAttribute('data-gc'))) {
      if (a === 'start') { S.gcStep = 0; go('goalcheck'); }
      else if (S.gcStep < 2) { S.gcStep += 1; render(); window.scrollTo({ top: 0 }); }
      else { S.gcStep = 0; go('home'); }
      return;
    }
    var target = t.getAttribute('data-go');
    if (target && find(target)) { go(target); return; }
    var group = t.parentElement;
    if (group && (group.classList.contains('seg') || group.classList.contains('tabs') || group.classList.contains('sorts') || group.classList.contains('optrow'))) {
      Array.prototype.forEach.call(group.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
      t.setAttribute('aria-pressed', 'true');
    }
  });

  stage.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.classList) return;
    if (t.classList.contains('msearch')) {
      var scr = t.closest('.screen');
      scr.querySelector('.tree').innerHTML = memTree(t.value);
      scr.querySelector('.mcount').innerHTML = memCount(t.value);
      scr.querySelector('.tree').scrollTop = 0;
    } else if (t.classList.contains('dfield')) {
      S[t.getAttribute('data-f')] = t.value.replace(/\D/g, '');
      var d = fieldsDate(), box = t.closest('.screen').querySelector('.dinfo');
      box.innerHTML = d ? '<p class="dtext">' + ymd(d) + ' · ' + dText(dayDiff(today(), d)) + '</p>' : '<p class="dbad">없는 날짜예요. 년 · 월 · 일을 확인해 주세요.</p>';
      if (d) { S.calY = d.getFullYear(); S.calM = d.getMonth(); }
    }
  });
  stage.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'baseDate' && t.value) { S.baseISO = t.value; recompute(); render(true); }
  });

  var timer;
  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(timer); timer = setTimeout(function () { render(true); }, 120);
  });
  window.__S = S; window.__calc = function (p, iso0) { var q = iso0.split('-'); var d = calcDate(p, new Date(+q[0], +q[1] - 1, +q[2])); return iso(d); };
  render();
})();

</script>
</body>
</html>
